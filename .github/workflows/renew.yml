name: Server Auto Renew

on:
  schedule:
    # 每天 UTC 时间 4:00 运行 (北京时间 12:00)
    - cron: '0 4 * * *'
  workflow_dispatch: # 支持手动触发

jobs:
  renew:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install seleniumbase requests
        # 安装 SeleniumBase 的 UC 模式所需浏览器环境（会自动配置 Chrome / ChromeDriver）
        seleniumbase install chromedriver
        python -c "from seleniumbase import SB; print('SeleniumBase ready')"

    - name: 启用 WARP 网络
      uses: fscarmen/warp-on-actions@v1.3
      with:
          stack: dual
          mode: client

    - name: Run renewal script
      env:
        LOGIN_URL: ${{ secrets.LOGIN_URL }}
        SERVICES_URL: ${{ secrets.SERVICES_URL }}
        FRIDAY_EMAIL: ${{ secrets.FRIDAY_EMAIL }}
        FRIDAY_PASSWORD: ${{ secrets.FRIDAY_PASSWORD }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: |
        python renew.py
